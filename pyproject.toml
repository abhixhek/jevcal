[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jevcal"
version = "0.1.0"
description = "Calibrate, threshold, and drift-check typed decision models (TypeSafe Jev and friends) against an LLM teacher."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]
keywords = ["jev", "typesafe", "calibration", "evals", "llm", "cascade"]

[project.optional-dependencies]
anthropic = ["anthropic"]
dev = ["pytest>=8"]

[project.scripts]
jevcal = "jevcal.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jevcal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
